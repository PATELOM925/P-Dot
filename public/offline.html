<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)" />
    <title>Offline · P-Dot</title>
    <style>
      :root {
        --bg: #f4f4f7;
        --surface: #ffffff;
        --text: #17181f;
        --muted: #5a6070;
        --accent: #4f46e5;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14151a;
          --surface: #1d1f26;
          --text: #eef0f5;
          --muted: #aab0bf;
          --accent: #9a93ff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }
      img {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      button {
        min-height: 2.75rem;
        padding: 0.5rem 1.375rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>P-Dot needs a connection to load your conversations and lists. Nothing is stored on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
